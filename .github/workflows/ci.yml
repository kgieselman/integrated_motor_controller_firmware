name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  build:
    name: Build Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t imc-firmware-dev .

      - name: Build all targets
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            imc-firmware-dev \
            scripts/build.sh --target all --type Debug

      - name: Build Release (bringup)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            imc-firmware-dev \
            scripts/build.sh --target imc_bringup --type Release

      - name: Build Release (tactical)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            imc-firmware-dev \
            scripts/build.sh --target imc_tactical --type Release

      - name: Upload ELF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.sha }}
          path: |
            build/*.elf
            build/*.map
          retention-days: 30

  static-analysis:
    name: cppcheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t imc-firmware-dev .

      - name: Configure (generate compile_commands.json)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            imc-firmware-dev \
            cmake -S . -B build -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE=cmake/gcc-arm-none-eabi.cmake \
              -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run cppcheck
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            imc-firmware-dev \
            scripts/cppcheck.sh --ci
